<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Babysitters | Little Stars Care</title>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header"></header>

<section class="page-hero">
  <div class="container">
    <h1>Meet Our Babysitters</h1>
    <p>Experienced and trusted caregivers.</p>
  </div>
</section>

<section class="section">
  <div class="container grid-3">

    <article class="sitter-card animate-in">
      <img class="sitter-card-img"
      src="https://placehold.co/400x400"
      alt="Babysitter">

      <div class="sitter-card-body">
        <h3 class="sitter-card-name">Emma Johnson</h3>

        <p class="sitter-card-desc">
          CPR certified with 4 years of babysitting experience.
        </p>

        <a href="booking.html" class="btn btn-primary">
          Book Emma
        </a>
      </div>
    </article>

    <article class="sitter-card animate-in">
      <img class="sitter-card-img"
      src="https://placehold.co/400x400"
      alt="Babysitter">

      <div class="sitter-card-body">
        <h3 class="sitter-card-name">Olivia Davis</h3>

        <p class="sitter-card-desc">
          Specializes in infant and toddler care.
        </p>

        <a href="booking.html" class="btn btn-primary">
          Book Olivia
        </a>
      </div>
    </article>

  </div>
</section>

<script src="js/main.js"></script>
</body>
</html>
